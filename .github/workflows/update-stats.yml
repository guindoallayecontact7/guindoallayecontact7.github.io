name: Mise à jour des statistiques OSM / HOT

on:
  schedule:
    - cron: "0 4 * * *"   # chaque jour à 04:00 UTC
  workflow_dispatch:       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire les statistiques publiques OpenStreetMap
        run: python tools/update_stats.py data/stats.json

      - name: Publier si les chiffres ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Statistiques OSM/HOT mises à jour automatiquement"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
